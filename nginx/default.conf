limit_req_zone $binary_remote_addr zone=profile_image_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=post_upload:10m rate=10r/m;

# 카카오페이 결제 복귀(/payments/result)의 pg_token이 access log에 남지 않게 한다.
# 결과 페이지가 이어서 보내는 요청의 Referer에도 같은 쿼리가 실리므로 함께 지운다.
map $request_uri $log_request_uri {
    "~^/payments/result(\?|$)" "/payments/result";
    default $request_uri;
}

map $http_referer $log_referer {
    "~^(?<referer_without_query>[^?]*)\?.*pg_token=" $referer_without_query;
    default $http_referer;
}

log_format gamerin '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $log_request_uri $server_protocol" $status $body_bytes_sent '
                   '"$log_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log gamerin;

    client_max_body_size 200m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/messages/stream {
        proxy_pass http://backend:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /api/v1/users/me/profile-images {
        client_max_body_size 6m;
        limit_req zone=profile_image_upload burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    location = /api/v1/posts {
        client_max_body_size 530m;
        limit_req zone=post_upload burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    # 오류 로그 형식은 바꿀 수 없어 업스트림 실패 시 쿼리(pg_token)가 남으므로 이 경로는 crit만 기록한다.
    # 결과 페이지가 이어서 보내는 요청에 Referer(pg_token 포함 URL)가 실리지 않게 no-referrer로 덮어쓴다.
    location = /payments/result {
        error_log /var/log/nginx/error.log crit;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://frontend:3000;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://frontend:3000;
    }
}
