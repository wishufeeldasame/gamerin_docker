# 로컬 통합 테스트 전용 override. 운영 서버(OCI Ampere A1 2 OCPU)처럼 backend가 코어 2개만 쓰게 고정한다.
# 사용: docker compose --env-file .env -f docker-compose.yml -f docker-compose.bench.yml up -d backend
# cpus(사용 시간 제한)가 아닌 cpuset(코어 고정)을 쓴다. cpus는 컨테이너에 호스트 코어가 모두 보여 x264가 스레드를 과하게 만들고
# 실제보다 크게 느려진다. 로컬 코어는 Neoverse N1보다 빠르므로 처리 시간은 실서버보다 짧게 나온다(실서버 측정으로 확인).
services:
  backend:
    cpuset: "${BENCH_BACKEND_CPUSET:-0,1}"
