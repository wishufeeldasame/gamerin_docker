# 배포 전용 override. 로컬 개발은 docker-compose.yml만 사용한다(http://localhost 그대로).
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d
# Caddy만 80/443을 공개하고 nginx 호스트 포트는 닫는다(!reset은 Compose 2.24+).
# nginx/default.conf의 신뢰 IP(10.250.0.2)와 아래 caddy 고정 IP가 같아야 한다.
# 기존 gamerin 네트워크(서브넷 없음)가 떠 있으면 서브넷 변경이 안 되므로 먼저 down 후 올린다.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-gamerin.live}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy:/data
    networks:
      gamerin:
        ipv4_address: 10.250.0.2

  nginx:
    ports: !reset []

networks:
  gamerin:
    ipam:
      config:
        - subnet: 10.250.0.0/24
          # 동적 할당은 .128 이후로 제한해 caddy 고정 IP(.2)를 다른 컨테이너가 먼저 가져가지 않게 한다.
          ip_range: 10.250.0.128/25
